<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" fill="none" role="img" aria-label="数据共享交换示意图">
  <defs>
    <linearGradient id="hub" x1="250" y1="150" x2="370" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#60a5fa" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.4" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <path id="route-tl" d="M198 104 C244 126 278 160 310 196"/>
    <path id="route-tr" d="M422 104 C378 126 344 160 310 196"/>
    <path id="route-bl" d="M198 316 C244 294 278 262 310 224"/>
    <path id="route-br" d="M422 316 C378 294 344 262 310 224"/>
  </defs>

  <!-- 背景：点阵与光晕 -->
  <rect x="16" y="16" width="588" height="388" rx="24" fill="url(#dots)"/>
  <circle cx="310" cy="210" r="196" fill="url(#halo)"/>
  <circle cx="310" cy="210" r="132" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="310" cy="210" r="96" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- 连接线 -->
  <g stroke="url(#link)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 7">
    <use href="#route-tl"/>
    <use href="#route-tr"/>
    <use href="#route-bl"/>
    <use href="#route-br"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- 沿链路流动的数据点 -->
  <g fill="#a5f3fc">
    <circle r="3.2">
      <animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#route-tl"/></animateMotion>
    </circle>
    <circle r="3.2">
      <animateMotion dur="4.2s" begin="0.6s" repeatCount="indefinite"><mpath href="#route-tr"/></animateMotion>
    </circle>
    <circle r="3.2">
      <animateMotion dur="3.9s" begin="1.2s" repeatCount="indefinite"><mpath href="#route-bl"/></animateMotion>
    </circle>
    <circle r="3.2">
      <animateMotion dur="4.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#route-br"/></animateMotion>
    </circle>
  </g>

  <!-- 中心交换枢纽 -->
  <g filter="url(#glow)">
    <circle cx="310" cy="210" r="56" fill="url(#hub)" fill-opacity="0.28"/>
    <circle cx="310" cy="210" r="44" fill="url(#hub)"/>
  </g>
  <circle cx="310" cy="210" r="58" stroke="#e0f2fe" stroke-opacity="0.5" stroke-dasharray="3 9">
    <animateTransform attributeName="transform" type="rotate" from="0 310 210" to="360 310 210" dur="26s" repeatCount="indefinite"/>
  </circle>
  <!-- 数据库图形 -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <ellipse cx="310" cy="196" rx="17" ry="6.2" fill="#ffffff" fill-opacity="0.22"/>
    <path d="M293 196v20c0 3.4 7.6 6.2 17 6.2s17-2.8 17-6.2v-20"/>
    <path d="M293 206c0 3.4 7.6 6.2 17 6.2s17-2.8 17-6.2"/>
  </g>

  <!-- 卫星卡片：数据库 -->
  <g>
    <rect x="60" y="58" width="140" height="78" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.28"/>
    <g transform="translate(78 76)" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round">
      <ellipse cx="14" cy="5.5" rx="12" ry="4.4" fill="#bae6fd" fill-opacity="0.25"/>
      <path d="M2 5.5v15c0 2.4 5.4 4.4 12 4.4s12-2 12-4.4v-15"/>
      <path d="M2 12.5c0 2.4 5.4 4.4 12 4.4s12-2 12-4.4"/>
    </g>
    <text x="124" y="90" fill="#ffffff" font-size="14" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">业务数据库</text>
    <text x="124" y="110" fill="#c7d2fe" font-size="10.5" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">MySQL · 达梦 · 金仓</text>
  </g>

  <!-- 卫星卡片：文件库 -->
  <g>
    <rect x="420" y="58" width="140" height="78" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.28"/>
    <g transform="translate(438 74)" stroke="#bae6fd" stroke-width="1.8" stroke-linejoin="round">
      <path d="M3 1h11l6 6v19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z" fill="#bae6fd" fill-opacity="0.18"/>
      <path d="M14 1v6h6"/>
      <path d="M6 13h10M6 17.5h10M6 22h6"/>
    </g>
    <text x="484" y="90" fill="#ffffff" font-size="14" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">文件交换区</text>
    <text x="484" y="110" fill="#c7d2fe" font-size="10.5" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">SFTP · MinIO · 分片</text>
  </g>

  <!-- 卫星卡片：共享服务 -->
  <g>
    <rect x="60" y="286" width="140" height="78" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.28"/>
    <g transform="translate(80 302)" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M9 6 3 12l6 6M19 6l6 6-6 6M16 3l-4 18"/>
    </g>
    <text x="124" y="318" fill="#ffffff" font-size="14" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">共享服务</text>
    <text x="124" y="338" fill="#c7d2fe" font-size="10.5" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">API 网关 · 限流</text>
  </g>

  <!-- 卫星卡片：安全管控 -->
  <g>
    <rect x="420" y="286" width="140" height="78" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.28"/>
    <g transform="translate(440 300)" stroke="#bae6fd" stroke-width="1.8" stroke-linejoin="round">
      <path d="M11 1 2 5v8c0 7 4.6 12 9 14 4.4-2 9-7 9-14V5z" fill="#bae6fd" fill-opacity="0.18"/>
      <path d="m7 12 3.2 3.2L16 8.5"/>
    </g>
    <text x="484" y="318" fill="#ffffff" font-size="14" font-weight="600" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">安全管控</text>
    <text x="484" y="338" fill="#c7d2fe" font-size="10.5" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">分级 · 脱敏 · 审计</text>
  </g>

  <!-- 装饰粒子 -->
  <g fill="#e0f2fe" fill-opacity="0.7">
    <circle cx="96" cy="196" r="2.6"/>
    <circle cx="536" cy="188" r="2.2"/>
    <circle cx="352" cy="52" r="2.4"/>
    <circle cx="268" cy="368" r="2.4"/>
  </g>
</svg>
