server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: share-exchange
  # 开发态使用内存 H2（每次启动自动建表+初始化演示数据，重启即重置，演示环境最稳）。
  # 需要持久化时：--spring.profiles.active=file（文件库）或 mysql（生产 MySQL）。
  datasource:
    url: jdbc:h2:mem:share;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  web:
    resources:
      static-locations: classpath:/static/
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    client-id: ${KAFKA_CLIENT_ID:share-exchange}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:share-exchange}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: false
    admin:
      fail-fast: false

# ===== 平台自身配置 =====
share:
  jwt:
    # 生产环境必须通过环境变量 SHARE_JWT_SECRET 覆盖
    secret: ${SHARE_JWT_SECRET:share-exchange-platform-default-secret-key-2026-change-it-32bytes}
    access-minutes: 15
    refresh-days: 7
  crypto:
    key: ${SHARE_CRYPTO_KEY:share-exchange-local-crypto-key-change-me}
    # 数据源口令等敏感配置加密存储
  file:
    root: ./data/files
    chunk-size: 1048576
    max-size-mb: 200
  engine:
    batch-size: 500
    max-rows-per-run: 200000
    retry-times: 3
    retry-interval-seconds: 10
    proxy:
      # seatunnel / flink；生成作业配置，外部提交开关关闭时由内置引擎执行
      provider: ${SHARE_ENGINE_PROVIDER:seatunnel}
      config-dir: ${SHARE_ENGINE_CONFIG_DIR:./data/engine-jobs}
      flink-rest-url: ${FLINK_REST_URL:}
      submit-enabled: ${SHARE_ENGINE_SUBMIT_ENABLED:false}
  security:
    password-min-length: 8
    # 敏感数据默认密级（4 级最高）
    sensitive-level: 3
  auth:
    captcha:
      # 图形验证码开关；关闭后登录不再要求验证码（仅限自动化联调）
      enabled: ${SHARE_CAPTCHA_ENABLED:true}
      length: 4
      ttl-seconds: 120
      max-attempts: 5
      # 演示环境把验证码明文随接口返回，便于脚本/联调；生产（mysql profile）已默认关闭
      expose-code: ${SHARE_CAPTCHA_EXPOSE_CODE:true}
  monitor:
    heartbeat-timeout-seconds: 90
    audit-retention-days: 180
    # 审计清理模式：LOGICAL（逻辑删除，默认）/ ARCHIVE（CSV 归档后物理删除）/ PHYSICAL（直接物理删除）
    audit-cleanup-mode: LOGICAL
    audit-archive-dir: ./data/audit-archive
  gateway:
    # 集群级限流：基于数据库秒级窗口计数，多实例共享额度
    cluster-rate-limit:
      enabled: true
    # 熔断器：窗口内失败达到阈值后打开，冷却后半开探测
    circuit:
      failure-threshold: 5
      window-seconds: 60
      open-seconds: 30
    apisix:
      enabled: ${SHARE_APISIX_ENABLED:false}
      admin-url: ${APISIX_ADMIN_URL:http://127.0.0.1:9180}
      admin-key: ${APISIX_ADMIN_KEY:share-apisix-admin-key}
      upstream-host: ${SHARE_APISIX_UPSTREAM_HOST:127.0.0.1}
      upstream-port: ${SHARE_APISIX_UPSTREAM_PORT:8080}
      jwt-consumer: ${SHARE_APISIX_JWT_CONSUMER:share_platform}
      jwt-secret: ${SHARE_JWT_SECRET:}
  redis:
    enabled: ${SHARE_REDIS_ENABLED:false}
    rate-limit-enabled: ${SHARE_REDIS_RATE_LIMIT_ENABLED:true}
    session-enabled: ${SHARE_REDIS_SESSION_ENABLED:true}
  storage:
    minio:
      enabled: ${SHARE_MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:shareadmin}
      secret-key: ${MINIO_SECRET_KEY:shareadmin123}
      bucket: ${MINIO_BUCKET:share-files}
    mysql:
      replica:
        enabled: ${MYSQL_REPLICA_ENABLED:false}
        url: ${MYSQL_REPLICA_URL:jdbc:mysql://127.0.0.1:3307/share_exchange?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
        username: ${MYSQL_REPLICA_USER:share}
        password: ${MYSQL_REPLICA_PASSWORD:}
        hikari:
          maximum-pool-size: 12
          minimum-idle: 2
  search:
    elasticsearch:
      enabled: ${SHARE_ES_ENABLED:false}
      url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
      index: ${ELASTICSEARCH_AUDIT_INDEX:share-audit}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
  kafka:
    enabled: ${SHARE_KAFKA_ENABLED:false}
    topics:
      audit: ${SHARE_KAFKA_TOPIC_AUDIT:share.audit}
      exchange: ${SHARE_KAFKA_TOPIC_EXCHANGE:share.exchange}
      notify: ${SHARE_KAFKA_TOPIC_NOTIFY:share.notify}
  seed:
    enabled: true
  scheduler:
    # 拆进程部署时：中心节点 false，worker 节点 true，避免定时任务重复执行
    enabled: ${SHARE_SCHEDULER_ENABLED:true}
  registry:
    nacos:
      enabled: ${SHARE_REGISTRY_NACOS_ENABLED:false}
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      service-name: ${SHARE_REGISTRY_NACOS_SERVICE_NAME:share-exchange-center}
      group: ${NACOS_GROUP:DEFAULT_GROUP}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      ip: ${SHARE_REGISTRY_NACOS_IP:}
      cluster: ${NACOS_CLUSTER:DEFAULT}
      role: ${SHARE_REGISTRY_NACOS_ROLE:center}
  mtls:
    enabled: ${SHARE_MTLS_ENABLED:false}
    port: ${SHARE_MTLS_PORT:8443}
    keystore: ${SHARE_MTLS_KEYSTORE:}
    keystore-password: ${SHARE_MTLS_KEYSTORE_PASS:changeit}
    truststore: ${SHARE_MTLS_TRUSTSTORE:}
    truststore-password: ${SHARE_MTLS_TRUSTSTORE_PASS:changeit}
  observability:
    loki:
      enabled: false
      url: ${LOKI_URL:http://127.0.0.1:3100/loki/api/v1/push}
    skywalking:
      batch-tag: ${SHARE_SKYWALKING_BATCH_TAG:true}

logging:
  level:
    root: INFO
    com.share: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
  file:
    name: ./data/logs/share-exchange.log
  logback:
    rollingpolicy:
      max-history: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
