spring:
  datasource:
    # 文件型 H2：数据持久化在 ./data 下（部分受限/沙箱环境可能出现二次打开只读，生产建议直接用 mysql profile）
    url: jdbc:h2:file:./data/share-exchange;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.share: INFO
